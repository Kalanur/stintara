name: Build Windows test agent

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r agent/requirements-build.txt
      - name: Build onefile agent
        shell: pwsh
        run: ./agent/build-windows.ps1
      - name: Smoke test without configuration or network
        shell: pwsh
        run: |
          ./dist/StintaraAgent.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Agent help failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: StintaraAgent-windows
          if-no-files-found: error
          path: |
            dist/StintaraAgent.exe
            dist/stintara-agent.example.json
