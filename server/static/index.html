<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stintara</title>
<style>
body{font-family:system-ui,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;background:#111;color:#eee}a{color:#fff}.muted{color:#999}.card{border:1px solid #333;border-radius:14px;padding:18px;margin:14px 0;background:#171717}.live{color:#57d68d;font-weight:700}.big{font-size:28px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.metric{background:#202020;padding:12px;border-radius:10px}
</style>
</head><body>
<h1>Stintara</h1><p class="muted">LIVE SESSIONS</p><div id="live">Loading…</div>
<footer class="muted" style="margin-top:24px;font-size:12px;overflow-wrap:anywhere">__BUILD_LABEL__</footer>
<script>

const esc = value => String(value ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getJSON(url) {
  const response = await fetch(url, {cache:'no-store'});
  if (!response.ok) throw new Error('Live sessions unavailable. Retrying…');
  return response.json();
}

async function refresh() {
  const root = document.querySelector('#live');
  try {
    const data = await getJSON('/api/sessions/live');
    root.innerHTML = data.length ? data.map(x => `<div class="card">
      <div class="live">Receiving scoring</div><h2>${esc(x.track_name)}</h2>
      <div>${esc(x.simulator_provider)} · ${esc(x.session_type)} · ${esc(x.participant_count)} participants</div>
      <p class="muted">Started ${esc(x.started_at)}<br>Session ${esc(x.id)}</p>
      <p><a href="/sessions/${esc(encodeURIComponent(x.id))}/live">Watch full field →</a></p></div>`).join('')
      : '<div class="card muted">No live sessions are currently receiving scoring.</div>';
  } catch (error) { root.textContent = error.message; }
  finally { setTimeout(refresh, 1000); }
}
refresh();
</script></body></html>
