<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stintara Spectator</title><style>
body{font-family:system-ui,sans-serif;max-width:1200px;margin:28px auto;padding:0 16px;background:#111;color:#eee}.muted{color:#999}.live{color:#57d68d;font-weight:700}.hero{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin:16px 0}.metric{background:#1d1d1d;border:1px solid #333;border-radius:12px;padding:12px}.value{font-size:24px;font-weight:700}table{width:100%;border-collapse:collapse;background:#171717}th,td{text-align:left;padding:8px;border-bottom:1px solid #2b2b2b}tr.me{background:#242424}a{color:white}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}table{font-size:12px}}

.table-scroll{overflow-x:auto}th{white-space:nowrap}caption{text-align:left;padding:12px 0;color:#aaa}.status{padding:12px;border:1px solid #555;border-radius:8px}td{vertical-align:top}
.focus{background:#193c30!important;box-shadow:inset 3px 0 #57d68d}.h2h{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.h2h article{padding:12px;border:1px solid #555;border-radius:8px;overflow-wrap:anywhere}.h2h dl{display:grid;grid-template-columns:1fr 1fr;gap:6px}.h2h dd{margin:0}.focus-control{margin:20px 0}select{max-width:100%;padding:8px;background:#222;color:#eee;border:1px solid #777;border-radius:6px}@media(max-width:700px){.h2h{grid-template-columns:1fr}}
</style></head><body><a href="/">← Stintara</a>
<div class="focus-control"><label for="focus">Focus participant</label> <select id="focus"><option value="">Choose a participant</option></select></div>
<section aria-label="Fuel validation"><h2>Fuel · Experimental</h2><div id="fuel">Choose a participant to inspect fuel data.</div></section>
<div id="root">Loading…</div>
<footer class="muted" style="margin-top:24px;font-size:12px;overflow-wrap:anywhere">__BUILD_LABEL__</footer>
<script>
__WEATHER_UI__
const esc = value => String(value ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => Number.isFinite(t) && t > 0 ? `${Math.floor(t/60)}:${(t%60).toFixed(3).padStart(6,'0')}` : '—';

function vehicleLabel(p) {
  for (const [key, label] of [['vehicle_model','Model'], ['manufacturer','Manufacturer'],
                            ['entry_name','Entry'], ['car_name','Entry'],
                            ['vehicle_class','Class'], ['car_class','Class']]) {
    if (typeof p[key] === 'string' && p[key].trim()) return {label, value:p[key]};
  }
  return {label:null, value:'—'};
}
function vehicleCell(p, hideClass=false) {
  const {label, value} = vehicleLabel(p);
  return label && !(hideClass && label === 'Class') ? `<div class="muted">${esc(label)}</div><div>${esc(value)}</div>` : '—';
}

function singleClass(participants) {
  if (!participants.length) return null;
  const classes = participants.map(p => typeof p.vehicle_class === 'string' ? p.vehicle_class.trim() : '');
  return classes[0] && classes.every(value => value === classes[0]) ? classes[0] : null;
}

// Selection helpers operate on participant UUIDs and the existing API order only.
function participantById(participants, id) {
  if (typeof id !== 'string' || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) return null;
  return participants.find(p => p.id === id.toLowerCase()) || null;
}
function resolveFocus(participants, requested, allowDefault=false) {
  if (requested !== null) return participantById(participants, requested)?.id || null;
  const registered = participants.filter(p => p.driver_slug);
  return allowDefault && registered.length === 1 ? participantById(participants, registered[0].id)?.id || null : null;
}
function relativeWindow(participants, focusId) {
  const focus = participantById(participants, focusId);
  const index = focus ? participants.indexOf(focus) : -1;
  return index < 0 ? [] : participants.slice(Math.max(0, index - 3), index + 4);
}
function validPosition(position) {
  return Number.isSafeInteger(position) && position > 0;
}
function uniquePositionNeighbor(participants, focus, offset) {
  if (!focus || !validPosition(focus.position) || ![-1, 1].includes(offset)) return null;
  const target = focus.position + offset;
  if (!validPosition(target)) return null;
  const matches = participants.filter(p => validPosition(p.position) && p.position === target);
  return matches.length === 1 ? matches[0] : null;
}
function focusURL(href, focusId) {
  const url = new URL(href);
  if (focusId) url.searchParams.set('focus', focusId);
  else url.searchParams.delete('focus');
  return url.pathname + url.search + url.hash;
}
function seconds(value, signed=false) {
  return Number.isFinite(value) ? `${signed && value > 0 ? '+' : ''}${value.toFixed(1)} s` : '—';
}
function gapText(p, race) {
  if (!race) return '—';
  if (Number.isSafeInteger(p.gap_laps) && p.gap_laps > 0) return `${p.gap_laps} L`;
  return Number.isFinite(p.gap_to_leader) && p.gap_to_leader >= 0 ? seconds(p.gap_to_leader) : '—';
}
function intervalText(p, race) {
  return race && Number.isFinite(p.gap_to_leader) && p.gap_to_leader >= 0 && !p.gap_laps &&
    Number.isFinite(p.interval) && p.interval >= 0 ? seconds(p.interval) : '—';
}
function intervalToFocus(p, focus, race) {
  if (!race || !p || !focus || p.id === focus.id) return null;
  if (p.interval_preceding_id === focus.id && intervalText(p, race) !== '—') return p.interval;
  if (focus.interval_preceding_id === p.id && intervalText(focus, race) !== '—') return -focus.interval;
  return null;
}
function clockText(value) {
  if (!Number.isFinite(value) || value < 0) return '—';
  const whole = Math.floor(value);
  return `${Math.floor(whole/3600)}:${String(Math.floor(whole/60)%60).padStart(2,'0')}:${String(whole%60).padStart(2,'0')}`;
}
function sessionContext(d) {
  const t = d.timing || {};
  const configured = Number.isFinite(t.configured_minutes) && t.configured_minutes > 0 ? `${t.configured_minutes} min` :
    Number.isSafeInteger(t.configured_laps) && t.configured_laps > 0 ? `${t.configured_laps} laps` : '—';
  return `<p>Configured distance / duration: ${configured} · Elapsed session time: ${d.live ? clockText(t.elapsed_seconds) : '—'}</p>`;
}
function focusTiming(participants, focusId) {
  const p = participantById(participants, focusId);
  return p ? `<section><h2>Focused timing</h2><p>Completed laps: ${esc(p.total_laps)}</p>
    <p>Last completed lap sectors · checkpoint lap ${esc(p.sector_lap_number)}</p>
    <div class="metrics">${['sector1','sector2','sector3'].map((key,i) => `<div class="metric">S${i+1}<div class="value">${fmt(p[key])}</div></div>`).join('')}</div></section>` : '';
}
function timingCells(p) {
  return `<td>${esc(p.total_laps)}</td><td>${fmt(p.last_lap_time)}</td><td>${fmt(p.best_lap_time)}</td><td>${p.in_pits === true ? 'PIT' : '—'}</td><td>—</td>`;
}
function relativeWidget(participants, focusId) {
  const rows = relativeWindow(participants, focusId);
  const hideClass = singleClass(participants) !== null;
  return `<section><h2>Relative</h2><p class="muted">Relative standings: surrounding entries in standings order, not physical order or time gaps.</p>
    ${rows.length ? `<div id="relative-scroll" class="table-scroll"><table><thead><tr><th>P</th><th>Driver</th>${hideClass ? '' : '<th>Class</th>'}<th>Completed laps</th><th>Last</th><th>Best</th><th>Pit</th><th>Interval</th></tr></thead>
    <tbody>${rows.map(p => `<tr class="${p.id === focusId ? 'focus' : ''}"><td>${esc(p.position)}</td><td>${esc(p.display_name)}${p.id === focusId ? ' · Focus' : ''}</td>${hideClass ? '' : `<td>${esc(p.vehicle_class || '—')}</td>`}${timingCells(p)}</tr>`).join('')}</tbody></table></div>` : '<p>Choose a participant to see relative standings.</p>'}</section>`;
}
function comparisonCard(label, p, focus, race, hideClass=false) {
  return `<article class="${label === 'Focus' ? 'focus' : ''}"><h3>${label}</h3>${p ? `<strong>${esc(p.display_name)}</strong><dl>
    <dt>Position</dt><dd>${esc(p.position)}</dd>${hideClass ? '' : `<dt>Class</dt><dd>${esc(p.vehicle_class || '—')}</dd>`}
    <dt>Completed laps</dt><dd>${esc(p.total_laps)}</dd><dt>Last</dt><dd>${fmt(p.last_lap_time)}</dd><dt>Best</dt><dd>${fmt(p.best_lap_time)}</dd>
    <dt>Pit</dt><dd>${p.in_pits === true ? 'PIT' : '—'}</dd><dt>Interval to focus</dt><dd>${seconds(intervalToFocus(p, focus, race), true)}</dd></dl>` : '<p>—</p>'}</article>`;
}
function headToHeadWidget(participants, focusId, race=false) {
  const hideClass = singleClass(participants) !== null;
  const focus = participantById(participants, focusId);
  return `<section><h2>Head-to-Head</h2><p class="muted">Ahead / Behind refer only to unique adjacent provider positions, not physical order. Intervals are signed relative to focus where comparable; ambiguous values remain unknown.</p><div class="h2h">
    ${comparisonCard('Ahead', uniquePositionNeighbor(participants, focus, -1), focus, race, hideClass)}${comparisonCard('Focus', focus, focus, race, hideClass)}${comparisonCard('Behind', uniquePositionNeighbor(participants, focus, 1), focus, race, hideClass)}</div></section>`;
}

const fuelNumber = (value, unit='', digits=2) => Number.isFinite(value) ? value.toFixed(digits)+unit : '—';
function fuelWidget(data) {
  const e = data.estimate, c = data.current, provider = data.provider || {};
  const available = c.fresh && Number.isFinite(c.fuel_l) && c.fuel_l >= 0;
  const comparison = [
    ['avg_consumption_l_per_lap','Provider consumption',' L/lap'], ['laps_remaining','Provider range',' laps'],
    ['stint_number','Provider stint',''], ['stint_laps','Provider stint laps',''],
    ['stint_consumption_l','Provider stint consumption',' L']
  ];
  return `<p>${e.status === 'collecting' ? `Collecting fuel data · ${esc(e.available_sample_count)} / ${esc(e.minimum_samples)} valid samples` : 'Checkpoint consumption estimate'}</p>
    <p>Current fuel: ${fuelNumber(c.fuel_l,' L')} · Capacity: ${fuelNumber(c.capacity_l,' L')}</p>
    <p>Stintara consumption: ${fuelNumber(e.consumption_l_per_lap,' L/lap')} · Valid samples used: ${esc(e.sample_count)}</p>
    <p>Estimated range: ${available ? fuelNumber(e.estimated_range_laps,' laps',1) : '—'}</p>
    ${available ? '' : '<p>Current fuel telemetry unavailable or stale.</p>'}
    <p class="muted">Strategy checkpoint: ${esc(c.recorded_at)}. Lap fuel checkpoint timing is not yet verified.</p>
    ${comparison.some(([key]) => Number.isFinite(provider[key])) ? `<h3>Provider comparison</h3><p class="muted">Provider/Pitwall values only; not part of the Stintara calculation. They share the strategy checkpoint timestamp above.</p>
    <ul>${comparison.map(([key,label,unit]) => `<li>${label}: ${fuelNumber(provider[key],unit)}</li>`).join('')}</ul>` : ''}
    <details id="fuel-diagnostics"><summary>Fuel sample diagnostics</summary><div class="table-scroll"><table>
    <thead><tr><th>Transition</th><th>Delta</th><th>Included</th><th>Used</th><th>Reason</th></tr></thead>
    <tbody>${data.samples.map(sample => `<tr><td>${esc(sample.from_lap)} → ${esc(sample.to_lap)}</td><td>${fuelNumber(sample.consumption_l,' L')}</td><td>${sample.included ? 'yes' : 'no'}</td><td>${sample.used_for_estimate ? 'yes' : 'no'}</td><td>${esc(sample.excluded_reason)}</td></tr>`).join('') || '<tr><td colspan="5">No checkpoint transitions yet.</td></tr>'}</tbody></table></div></details>`;
}

const sessionId = __SESSION_ID__;
const selector = document.querySelector('#focus');
let focusId = null;
let initialized = false;
let latestData = null;
let selectorOptions = '';
let fuelRequest = 0;
let fuelParticipant = null;
async function refreshFuel() {
  const request = ++fuelRequest;
  const participant = focusId;
  const root = document.querySelector('#fuel');
  if (!participant) {
    fuelParticipant = null;
    root.textContent = 'Choose a participant to inspect fuel data.';
    return;
  }
  if (fuelParticipant !== participant) root.textContent = 'Loading fuel data…';
  fuelParticipant = participant;
  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/participants/${encodeURIComponent(participant)}/fuel`, {cache:'no-store'});
    if (!response.ok) throw new Error('Fuel data unavailable. Retrying…');
    const data = await response.json();
    if (request !== fuelRequest || focusId !== participant) return;
    if (data.participant_id !== participant || data.session_id !== sessionId) throw new Error('Fuel data unavailable. Retrying…');
    const open = document.querySelector('#fuel-diagnostics')?.open || false;
    root.innerHTML = fuelWidget(data);
    const details = document.querySelector('#fuel-diagnostics');
    if (details) details.open = open;
  } catch (error) {
    if (request === fuelRequest && focusId === participant) root.textContent = 'Fuel data unavailable. Retrying…';
  }
}
function syncFocusURL() {
  const next = focusURL(location.href, focusId);
  const current = new URL(location.href);
  if (next !== current.pathname + current.search + current.hash) history.replaceState(null, '', next);
}
function renderSession(d) {
  const root = document.querySelector('#root');
  const race = d.session.session_type === 'Race';
  const fieldClass = singleClass(d.participants);
  const hideClass = fieldClass !== null;
  const scrolls = ['full-scroll', 'relative-scroll'].map(id => [id, document.querySelector('#'+id)?.scrollLeft || 0]);
  const options = '<option value="">Choose a participant</option>' + d.participants.map(p =>
    `<option value="${esc(p.id)}">${esc(p.position)} · ${esc(p.display_name)}</option>`).join('');
  if (options !== selectorOptions) { selector.innerHTML = options; selectorOptions = options; }
  selector.value = focusId || '';
  root.innerHTML = `<h1>${esc(d.session.track_name)}</h1>
      <p>${esc(d.session.simulator_provider)} · ${esc(d.session.session_type)} · ${hideClass ? esc(fieldClass)+' · ' : ''}${d.participants.length} participants</p>
      ${sessionContext(d)}
      <p class="status">${d.live ? 'Receiving scoring' : 'No live scoring — showing last stored standings'} · Last checkpoint: ${esc(d.session.last_seen_at)}</p>
      <p class="muted">Session ${esc(d.session.id)} · Started ${esc(d.session.started_at)}</p>
      ${weatherWidget(d.session.weather, d.live)}
      ${focusTiming(d.participants, focusId)}${relativeWidget(d.participants, focusId)}${headToHeadWidget(d.participants, focusId, race)}
      <h2>Full field</h2><div id="full-scroll" class="table-scroll"><table>
      <caption>Provider positions and lap times. Race Gap is leader-relative; Interval is to the preceding position when comparable. Unknown values remain —. Feed freshness does not establish race completion.</caption>
      <thead><tr><th scope="col">P</th><th scope="col">Driver</th>${hideClass ? '' : '<th scope="col">Class</th>'}<th scope="col">Vehicle / entry</th><th scope="col">Team</th><th scope="col">Number</th><th scope="col">Completed laps</th><th scope="col">Last</th><th scope="col">Best</th><th scope="col">Gap</th><th scope="col">Interval</th><th scope="col">Pit</th></tr></thead>
      <tbody>${d.participants.map(p => `<tr class="${p.id === focusId ? 'focus' : ''}"><td>${esc(p.position)}</td><td>${esc(p.display_name)}${p.id === focusId ? ' · Focus' : ''}${p.driver_slug ? `<br><a href="/drivers/${esc(encodeURIComponent(p.driver_slug))}/live">Driver live</a>` : ''}</td>
      ${hideClass ? '' : `<td>${esc(p.vehicle_class || '—')}</td>`}<td>${vehicleCell(p, hideClass)}</td><td>${esc(p.team_name || '—')}</td><td>${esc(p.car_number)}</td>
      <td>${esc(p.total_laps)}</td><td>${fmt(p.last_lap_time)}</td><td>${fmt(p.best_lap_time)}</td><td>${gapText(p, race)}</td><td>${intervalText(p, race)}</td><td>${p.in_pits === true ? 'PIT' : '—'}</td></tr>`).join('') || `<tr><td colspan="${hideClass ? 11 : 12}">No participants received yet.</td></tr>`}</tbody></table></div>`;
  for (const [id, left] of scrolls) {
    const element = document.querySelector('#'+id);
    if (element) element.scrollLeft = left;
  }
}
selector.addEventListener('change', () => {
  if (!latestData) return;
  focusId = resolveFocus(latestData.participants, selector.value);
  syncFocusURL();
  renderSession(latestData);
  void refreshFuel();
});
async function refresh() {
  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/live`, {cache:'no-store'});
    if (!response.ok) throw new Error(response.status === 404 ? 'Session not found.' : 'Session data unavailable. Retrying…');
    const d = await response.json();
    if (!initialized) {
      const params = new URL(location.href).searchParams;
      focusId = resolveFocus(d.participants, params.get('focus'), !params.has('focus'));
      initialized = true;
    } else {
      focusId = resolveFocus(d.participants, focusId);
    }
    latestData = d;
    syncFocusURL();
    renderSession(d);
    await refreshFuel();
  } catch (error) {
    document.querySelector('#root').textContent = error.message;
    ++fuelRequest;
    document.querySelector('#fuel').textContent = 'Fuel data unavailable while session data cannot be refreshed.';
  }
  finally { setTimeout(refresh, 500); }
}
refresh();
</script></body></html>
